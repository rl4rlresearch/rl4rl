task_id = "tiny_kws_rnn_source_only_cpu"
display_name = "Mini Speech Commands recurrent keyword spotting"
adapter = "tiny_kws_rnn_source_only_v1"
seed_source = "experiments/c0c3_factorial/task_sources/tiny_kws_rnn"
editable_paths = ["train.py"]
evaluator_command = [
  "{python}", "{repo_root}/experiments/c0c3_factorial/tiny_kws_rnn.py",
  "evaluate", "--workspace", "{workspace}", "--repo-root", "{repo_root}",
  "--output", "{output}", "--device", "cpu", "--training-examples", "50000",
  "--max-parameters", "100000",
]
objective_metric = "inference_cost"
objective_direction = "minimize"
qualification_metric = "validation_accuracy"
qualification_minimum = 0.85
public_feedback_metrics = [
  "validation_accuracy", "validation_cross_entropy", "inference_cost",
  "total_inference_macs", "recurrent_macs", "recurrent_steps",
  "mean_recurrent_steps", "median_recurrent_steps", "p95_recurrent_steps",
  "maximum_recurrent_steps", "parameters", "peak_hidden_elements",
  "examples_processed", "optimizer_steps", "training_seconds", "batch_size",
]
final_holdout_command = [
  "{python}", "{repo_root}/experiments/c0c3_factorial/tiny_kws_rnn.py",
  "holdout", "--workspace", "{workspace}", "--repo-root", "{repo_root}",
  "--output", "{output}", "--device", "cpu", "--training-examples", "50000",
  "--max-parameters", "100000",
]
preferred_backend = "local"

