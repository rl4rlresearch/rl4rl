task_id = "ten-digit-addition-transformer"
display_name = "trained transformer for 10-digit addition"
adapter = "ten_digit_addition_transformer_v1"
seed_source = "architecture_discovery/vendor/starting_model"
editable_paths = ["src/model.py", "src/data.py", "src/train.py"]
evaluator_command = [
  "{python}",
  "{repo_root}/experiments/c0c3_factorial/task_evaluators.py",
  "ten-digit-addition",
  "--workspace", "{workspace}",
  "--repo-root", "{repo_root}",
  "--python-bin", "{python}",
  "--output", "{output}",
]
objective_metric = "parameters"
objective_direction = "minimize"
qualification_metric = "accuracy"
qualification_minimum = 0.99
public_feedback_metrics = ["accuracy", "parameters", "training_steps"]
final_holdout_command = [
  "{python}",
  "{repo_root}/experiments/c0c3_factorial/task_evaluators.py",
  "ten-digit-addition-holdout",
  "--workspace", "{workspace}",
  "--repo-root", "{repo_root}",
  "--python-bin", "{python}",
  "--output", "{output}",
]
preferred_backend = "local"

[metric_patterns]
accuracy = "Results: [0-9]+/[0-9]+ correct \\(([0-9.]+)%\\)"
parameters = "Parameters \\(unique\\):\\s*([0-9,]+)"
training_steps = "step\\s+([0-9]+)"
