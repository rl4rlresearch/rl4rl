task_id = "fashion_mnist_semantic_v4_mps"
display_name = "Fixed-exposure 10-class grayscale image classification"
adapter = "fashion_mnist_source_only_v1"
seed_source = "experiments/c0c3_factorial/task_sources/fashion_mnist"
editable_paths = ["train.py"]
evaluator_command = [
  "{python}", "{repo_root}/experiments/c0c3_factorial/fashion_mnist.py",
  "evaluate-ladder", "--workspace", "{workspace}", "--repo-root", "{repo_root}",
  "--output", "{output}", "--device", "mps", "--training-examples", "100000",
  "--max-parameters", "250000",
  "--ladder-levels", "25000", "50000", "100000",
  "--promotion-thresholds", "0.82", "0.87", "none",
  "--ladder-minimum", "10000", "--ladder-max-rungs", "6",
]
objective_metric = "validation_score"
objective_direction = "maximize"
public_feedback_metrics = [
  "validation_score", "validation_correct", "validation_accuracy",
  "validation_cross_entropy", "parameters", "examples_processed",
  "optimizer_steps", "training_seconds", "batch_size",
  "fidelity_highest_level", "fidelity_screen_accuracy",
  "fidelity_reached_full",
]
final_holdout_command = [
  "{python}", "{repo_root}/experiments/c0c3_factorial/fashion_mnist.py",
  "holdout", "--workspace", "{workspace}", "--repo-root", "{repo_root}",
  "--output", "{output}", "--device", "mps", "--training-examples", "100000",
  "--max-parameters", "250000",
]
preferred_backend = "local"

[metric_patterns]
